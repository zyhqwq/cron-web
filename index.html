<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cron Schedule Generator</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; color: #333; margin-bottom: 24px; border-bottom: 1px solid #ddd; padding-bottom: 12px; }
    .mode-group { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .mode-group h3 { font-size: 1.1rem; color: #555; margin-bottom: 12px; }
    .mode-option { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 8px; }
    .mode-option:hover { background: #f0f0f0; }
    .mode-option.selected { background: #e8f0fe; border: 1px solid #088; }
    .mode-option input { accent-color: #088; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
    .form-group { margin: 8px 0; }
    .form-group label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 4px; }
    .time-select { width: 100%; padding: 8px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
    .weekday-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px 0; }
    .weekday-btn { padding: 6px 10px; font-size: 0.75rem; text-align: center; cursor: pointer; border: 1px solid #ddd; border-radius: 4px; background: #fff; }
    .weekday-btn:hover { background: #f5f5f5; }
    .weekday-btn.selected { background: #e8f0fe; border-color: #088; color: #088; }
    .input-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .input-row input { width: 100%; padding: 6px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    .clear-btn { cursor: pointer; color: #555; background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; padding: 4px 10px; font-size: 0.75rem; height: 34px; }
    .clear-btn:hover { background: #e8e8e8; color: #333; }
    .input-row input.error { border-color: #c00; background: #fff0f0; }
    .cron-display { background: #1a1a2e; color: #e94; font-family: monospace; padding: 16px; border-radius: 8px; margin: 20px 0; white-space: pre; font-size: 1.1rem; }
    .cron-explain { color: #555; font-size: 0.9rem; margin: -16px 0 20px; padding-left: 2px; }
    .help-text { font-size: 0.75rem; color: #666; line-height: 1.6; margin: 20px 0; }
    .note { font-size: 0.7rem; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>POSIX Cron 生成器</h1>

  <div class="mode-group">
    <h3>模式选择</h3>
    <div class="mode-option selected" id="mode-beijing">
      <input type="radio" name="mode" id="beijing-mode" checked>
      <span>使用北京时间转换为 UTC cron</span>
      <div class="note">北京时间 = UTC + 8，系统会自动减去 8 小时得到 UTC</div>
    </div>
    <div class="mode-option" id="mode-utc">
      <input type="radio" name="mode" id="utc-mode">
      <span>直接生成 UTC cron 语法</span>
      <div class="note">直接输入 UTC 时间，无需转换</div>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>小时 (0-23，逗号分隔多值，留空表示任意)</label>
      <div class="input-row">
        <input type="text" id="hour" placeholder="如 3,4 或留空">
        <button class="clear-btn" data-target="hour" title="清空重置为任意">重置</button>
      </div>
    </div>
    <div class="form-group">
      <label>分钟 (0-59，逗号分隔多值，留空表示任意)</label>
      <div class="input-row">
        <input type="text" id="minute" placeholder="如 0,15,30,45">
        <button class="clear-btn" data-target="minute" title="清空重置为任意">重置</button>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label>指定周几</label>
    <div class="weekday-grid">
      <button class="weekday-btn" data-day="0">日</button>
      <button class="weekday-btn" data-day="1">一</button>
      <button class="weekday-btn" data-day="2">二</button>
      <button class="weekday-btn" data-day="3">三</button>
      <button class="weekday-btn" data-day="4">四</button>
      <button class="weekday-btn" data-day="5">五</button>
      <button class="weekday-btn" data-day="6">六</button>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>日期 (1-31，逗号分隔)</label>
      <div class="input-row">
        <input type="text" id="day" placeholder="如 1,2,3,6,9">
        <button class="clear-btn" data-target="day" title="清空重置为任意">重置</button>
      </div>
    </div>
    <div class="form-group">
      <label>月份 (1-12 或 JAN-DEC，逗号分隔)</label>
      <div class="input-row">
        <input type="text" id="month" placeholder="如 1,3,5 或 JAN,MAR">
        <button class="clear-btn" data-target="month" title="清空重置为任意">重置</button>
      </div>
    </div>
  </div>

  <div class="cron-display" id="cronOutput">* * * * *</div>
  <div class="cron-explain" id="cronExplain">每分钟运行</div>

  <div class="help-text">
    <strong>规则提醒：</strong>
    <ul style="padding-left: 16px; margin: 8px 0;">
      <li>不支持秒字段、年字段</li>
      <li>不支持 L（最后一天）、W（工作日）、#（第N个星期X）扩展</li>
      <li>日和星期同时指定时，取<strong>交集</strong>（非并集），即只在同时匹配的日期运行</li>
      <li>* 表示任意值</li>
      <li>1,3,5 表示逗号分隔的多个值</li>
      <li>*/5 表示每隔 5 单位</li>
    </ul>
  </div>

  <script>
    const weekdayBtns = document.querySelectorAll('.weekday-btn');
    let selectedWeekdays = [];

    weekdayBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('selected');
        const day = parseInt(btn.dataset.day);
        if (selectedWeekdays.includes(day)) {
          selectedWeekdays = selectedWeekdays.filter(d => d !== day);
        } else {
          selectedWeekdays.push(day);
        }
        selectedWeekdays.sort((a, b) => a - b);
        updateCron();
      });
    });

    const hourSelect = document.getElementById('hour');
    const minuteSelect = document.getElementById('minute');
    const dayInput = document.getElementById('day');
    const monthInput = document.getElementById('month');
    const cronOutput = document.getElementById('cronOutput');

    const modeBeijingRadio = document.getElementById('beijing-mode');
    const modeUtcRadio = document.getElementById('utc-mode');

    function pad2(num) {
      return num.toString().padStart(2, '0');
    }

    function beijingToUtc(hour, minute) {
      let utcHour = hour - 8;
      let utcDayOffset = 0;
      if (utcHour < 0) {
        utcHour += 24;
        utcDayOffset = -1;
      }
      return { hour: utcHour, dayOffset: utcDayOffset };
    }

    function updateCron() {
      const hourRaw = hourSelect.value.trim();
      const minuteRaw = minuteSelect.value.trim();
      const dayRaw = dayInput.value.trim();
      const monthRaw = monthInput.value.trim();
      const beijingMode = modeBeijingRadio.checked;

      // 解析多值：逗号分隔 -> 数组，过滤空值，校验范围
      const parseVals = (raw, min, max) => {
        if (!raw) return { vals: [], any: true, error: false };
        const vals = raw.split(',').map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
        const invalid = vals.some(v => v < min || v > max);
        if (invalid) return { vals: [], any: false, error: true };
        return { vals, any: vals.length === 0, error: false };
      };

      const hourParsed = parseVals(hourRaw, 0, 23);
      const minuteParsed = parseVals(minuteRaw, 0, 59);
      const dayParsed = parseVals(dayRaw, 1, 31);
      const monthParsed = parseVals(monthRaw, 1, 12);

      // 错误时标记输入框
      hourSelect.classList.toggle('error', hourParsed.error);
      minuteSelect.classList.toggle('error', minuteParsed.error);
      dayInput.classList.toggle('error', dayParsed.error);
      monthInput.classList.toggle('error', monthParsed.error);

      const hourAny = hourParsed.any || hourParsed.error;
      const minuteAny = minuteParsed.any || minuteParsed.error;
      const dayAny = dayParsed.any || dayParsed.error;
      const monthAny = monthParsed.any || monthParsed.error;

      const hourVals = hourParsed.vals;
      const minuteVals = minuteParsed.vals;
      const dayVals = dayParsed.vals;
      const monthVals = monthParsed.vals;

      let cronHour;
      let cronMinute;
      let cronDay;
      let cronMonth;
      let cronDow;

      if (beijingMode) {
        // 北京时间转 UTC：每个小时值减 8，分钟不变
        const utcHours = hourVals.map(h => {
          let utc = h - 8;
          if (utc < 0) utc += 24;
          return utc;
        }).sort((a, b) => a - b);
        cronHour = hourAny ? '*' : utcHours.map(h => pad2(h)).join(',');
        cronMinute = minuteAny ? '*' : minuteVals.map(m => pad2(m)).join(',');
      } else {
        // 直接生成 UTC cron
        cronHour = hourAny ? '*' : hourVals.map(h => pad2(h)).join(',');
        cronMinute = minuteAny ? '*' : minuteVals.map(m => pad2(m)).join(',');
      }

      // Build day-of-month field
      cronDay = dayAny ? '*' : dayVals.join(',');

      // Build month field
      if (monthAny) {
        cronMonth = '*';
      } else {
        const monthMap = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
        const monthOut = monthVals.map(m => monthMap[m] || m);
        cronMonth = monthOut.join(',');
      }

      // Build day-of-week field
      if (selectedWeekdays.length === 0) {
        cronDow = '*';
      } else if (selectedWeekdays.length === 1) {
        cronDow = selectedWeekdays[0];
      } else {
        cronDow = selectedWeekdays.join(',');
      }

      const cronExpr = `${cronMinute} ${cronHour} ${cronDay} ${cronMonth} ${cronDow}`;
      cronOutput.textContent = cronExpr;

      // 生成中文解释（始终按北京时间语义）
      const explain = generateExplain(beijingMode, hourVals, minuteVals, dayVals, monthVals, selectedWeekdays, hourAny, minuteAny, dayAny, monthAny);
      document.getElementById('cronExplain').textContent = explain;
    }

    function generateExplain(beijingMode, hourVals, minuteVals, dayVals, monthVals, weekdays, hourAny, minuteAny, dayAny, monthAny) {
      // 北京时间的小时/分钟
      let bjHours, bjMinutes;
      if (beijingMode) {
        // 用户输入就是北京时间
        bjHours = hourAny ? null : hourVals;
        bjMinutes = minuteAny ? null : minuteVals;
      } else {
        // 用户输入是 UTC，转为北京时间（+8）
        bjHours = hourAny ? null : hourVals.map(h => { let b = h + 8; if (b >= 24) b -= 24; return b; });
        bjMinutes = minuteAny ? null : minuteVals;
      }

      // 时间部分
      let timeStr = '';
      if (bjHours && bjMinutes) {
        const times = bjHours.map((h, i) => {
          const m = bjMinutes[i % bjMinutes.length];
          return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        });
        timeStr = `每天 ${times.join('、')}`;
      } else if (bjHours) {
        timeStr = `每天 ${bjHours.map(h => `${h.toString().padStart(2, '0')}:00`).join('、')}`;
      } else if (bjMinutes) {
        timeStr = `每小时的 ${bjMinutes.map(m => `第${m}分`).join('、')}`;
      } else {
        timeStr = '每分钟';
      }

      // 日期部分
      let dateStr = '';
      if (!dayAny) {
        dateStr = `每月 ${dayVals.join('、')}号`;
      }
      if (!monthAny) {
        const mStr = monthVals.map(m => `${m}月`).join('、');
        dateStr = dateStr ? dateStr.replace('每月', mStr) : mStr;
      }
      if (dateStr) timeStr = dateStr + timeStr;

      // 星期部分
      if (weekdays.length > 0) {
        const weekMap = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const wkStr = weekdays.map(w => weekMap[w]).join('、');
        timeStr = `每周 ${wkStr} ` + timeStr;
      }

      return timeStr + ' 运行';
    }

    [hourSelect, minuteSelect, dayInput, monthInput].forEach(el => {
      el.addEventListener('change', updateCron);
      el.addEventListener('input', updateCron);
    });

    document.querySelectorAll('.clear-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.dataset.target;
        const targetEl = document.getElementById(targetId);
        if (targetEl) {
          targetEl.value = '';
          updateCron();
        }
      });
    });

    function syncModeVisual() {
      document.getElementById('mode-beijing').classList.toggle('selected', modeBeijingRadio.checked);
      document.getElementById('mode-utc').classList.toggle('selected', modeUtcRadio.checked);
    }

    [modeBeijingRadio, modeUtcRadio].forEach(radio => {
      radio.addEventListener('change', () => {
        syncModeVisual();
        updateCron();
      });
    });

    updateCron();
  </script>
</body>
</html>
